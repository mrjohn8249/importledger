[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "importledger"
version = "0.1.0"
description = "Find third-party Python imports missing from pyproject.toml dependencies"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Mr John"}]
keywords = ["python", "dependencies", "pyproject", "imports"]

[project.scripts]
importledger = "importledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
